name: Validate and deploy journal
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Test publication checks
        run: python -m unittest discover -s plugins/meor-journal/tests -v
      - name: Validate article packets
        run: python scripts/blog.py check
      - name: Validate and package plugin
        run: python scripts/package-plugin.py
      - name: Install verified Hugo
        env:
          HUGO_VERSION: '0.167.0'
        run: |
          set -euo pipefail
          asset="hugo_${HUGO_VERSION}_linux-amd64.tar.gz"
          release="https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}"
          mkdir -p "$RUNNER_TEMP/hugo"
          cd "$RUNNER_TEMP/hugo"
          curl -fLsS "$release/$asset" -o "$asset"
          curl -fLsS "$release/hugo_${HUGO_VERSION}_checksums.txt" -o checksums.txt
          grep " $asset$" checksums.txt | sha256sum --check --strict
          tar -xzf "$asset" hugo
          echo "$RUNNER_TEMP/hugo" >> "$GITHUB_PATH"
      - name: Build production site
        run: hugo --source site --environment production --minify --cleanDestinationDir
      - name: Check output boundaries and local links
        run: python scripts/blog.py check-output --directory site/public
      - name: Upload Pages artifact
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: site/public
  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
